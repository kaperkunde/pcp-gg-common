pcp_format: 3
version: 4
name: PDF MCP Server
description: "pdf-mcp, in Kaperkunde's reviewed fork: reads, fills, edits, splits, merges, redacts, signs and OCRs PDFs (English and Dutch), as an MCP server with 58 tools, including render_page (a page to a PNG picture), put_file, get_file, list_files and delete_file to move files in and out. Each tool states whether it reads, writes or deletes, and none writes over a file unless asked. It works only on files in its own data volume, and makes no network requests and no LLM calls."
image: ghcr.io/kaperkunde/pdf-mcp-server@sha256:9726a721cd6402624bb8fca699741c4388ccce02dde22d0396d7b74c5fbaa266
source: ghcr.io/kaperkunde/pdf-mcp-server:latest
ports:
  - container: 8000
env:
  - name: MCP_ALLOWED_HOSTS
    description: Only if you publish it on an address of your network rather than 127.0.0.1, type that address and port (192.0.2.10:8000), so it accepts requests sent to it. Leave empty otherwise.
    plain: true
volumes:
  - name: data
    path: /data
health:
  kind: http
  port: 8000
  path: /health
registers:
  kind: mcp
  port: 8000
  path: /mcp
