pcp_format: 3
version: 2
name: PDF MCP Server
description: "pdf-mcp, in Kaperkunde's reviewed fork: reads, fills, edits, splits, merges, redacts, signs and OCRs PDFs (English and Dutch), as an MCP server with 57 tools, including put_file/get_file to move files in and out. It works only on files in its own data volume, and makes no network requests and no LLM calls."
image: ghcr.io/kaperkunde/pdf-mcp-server@sha256:53a3b7ce6a1ac22fa3b016081e9fef8021f569b0b484cfe29c3623984e95491a
source: ghcr.io/kaperkunde/pdf-mcp-server:latest
ports:
  - container: 8000
env:
  - name: MCP_ALLOWED_HOSTS
    description: Only if you publish it on an address of your network rather than 127.0.0.1, type that address and port (192.0.2.10:8000), so it accepts requests sent to it. Leave empty otherwise.
    plain: true
volumes:
  - name: data
    path: /data
health:
  kind: http
  port: 8000
  path: /health
registers:
  kind: mcp
  port: 8000
  path: /mcp
