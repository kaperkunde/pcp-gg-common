pcp_format: 3
version: 1
name: PDF MCP Server
description: "pdf-mcp, in Kaperkunde's reviewed fork: reads, fills, edits, splits, merges, redacts, signs and OCRs PDFs (English and Dutch), as an MCP server with 53 tools. It works only on files in its own data volume, and makes no network requests and no LLM calls."
image: ghcr.io/kaperkunde/pdf-mcp-server@sha256:0d3801caf4f07800a6e6e80b8a2d3db3a9c5ec8f900561f6c4890c4151ca25b3
source: ghcr.io/kaperkunde/pdf-mcp-server:latest
ports:
  - container: 8000
env:
  - name: MCP_ALLOWED_HOSTS
    description: Only if you publish it on an address of your network rather than 127.0.0.1, type that address and port (192.0.2.10:8000), so it accepts requests sent to it. Leave empty otherwise.
    plain: true
volumes:
  - name: data
    path: /data
health:
  kind: http
  port: 8000
  path: /health
registers:
  kind: mcp
  port: 8000
  path: /mcp
